{% extends "base.html" %}
{% block title %}Create Listing - farmersblog{% endblock %}

{% block content %}
<div class="container" style="max-width: 680px;">
    <div class="card shadow-sm rounded-4 border-0">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-basket" style="font-size: 2rem; color: #28a745;"></i>
                <h3 class="fw-bold mt-2">Create a Listing</h3>
                <p class="text-muted">Sell your farming items to the community</p>
            </div>
            <form method="POST" action="{{ url_for('marketplace.create') }}" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="title" class="form-label fw-semibold">Title</label>
                    <input type="text" id="title" name="title" class="form-control bg-light border-0 rounded-4 p-3" placeholder="e.g., John Deere Tractor" required>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label fw-semibold">Description</label>
                    <textarea id="description" name="description" class="form-control bg-light border-0 rounded-4 p-3" rows="4" placeholder="Describe your item..." required></textarea>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="price" class="form-label fw-semibold">Price ($)</label>
                        <input type="number" id="price" name="price" class="form-control bg-light border-0 rounded-4 p-3" step="0.01" min="0" placeholder="0.00" required>
                    </div>
                    <div class="col-md-6">
                        <label for="category" class="form-label fw-semibold">Category</label>
                        <select id="category" name="category" class="form-select bg-light border-0 rounded-4 p-3" required>
                            <option value="">Select category</option>
                            {% for cat in categories %}
                            <option value="{{ cat }}">{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="location" class="form-label fw-semibold">Location (optional)</label>
                    <input type="text" id="location" name="location" class="form-control bg-light border-0 rounded-4 p-3" placeholder="e.g., Springfield, IL">
                </div>
                <div class="mb-4">
                    <label for="image" class="form-label fw-semibold">Image</label>
                    <div class="upload-area border-2 border-dashed rounded-4 p-4 text-center bg-light" id="uploadArea">
                        <i class="bi bi-image" style="font-size: 2rem; color: #28a745;"></i>
                        <p class="mt-2 mb-1 fw-semibold small">Click to upload an image</p>
                        <input type="file" id="image" name="image" class="form-control d-none" accept="image/png,image/jpg,image/jpeg,image/gif" required>
                        <button type="button" class="btn btn-outline-success btn-sm rounded-pill px-3" onclick="document.getElementById('image').click()">Choose Image</button>
                    </div>
                    <div id="imagePreview" class="mt-2 d-none">
                        <img id="previewImg" src="#" alt="Preview" class="img-fluid rounded-4" style="max-height: 200px; object-fit: contain;">
                        <button type="button" class="btn btn-sm btn-outline-danger rounded-pill mt-1" onclick="clearImagePreview()">
                            <i class="bi bi-x-circle me-1"></i>Remove
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 rounded-pill py-2 fw-semibold">
                    <i class="bi bi-plus-circle me-2"></i>Create Listing
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
