{% extends "base.html" %}
{% block title %}Login - farmersblog{% endblock %}

{% block content %}
<div class="container" style="max-width: 450px;">
    <div class="card shadow-sm rounded-4 border-0 mt-5">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-flower1" style="font-size: 2.5rem; color: #1877F2;"></i>
                <h3 class="fw-bold mt-2">Welcome Back</h3>
                <p class="text-muted">Login to your farmersblog account</p>
            </div>
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email</label>
                    <input type="email" id="email" name="email" class="form-control rounded-pill bg-light border-0 py-2 px-3" placeholder="Enter your email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password" id="password" name="password" class="form-control rounded-pill bg-light border-0 py-2 px-3" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">Login</button>
            </form>
            <div class="text-center mt-3">
                <p class="mb-0">Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-semibold">Register</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
