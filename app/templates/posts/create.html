{% extends "base.html" %}
{% block title %}Create Post - farmersblog{% endblock %}

{% block content %}
<div class="container" style="max-width: 680px;">
    <div class="card shadow-sm rounded-4 border-0">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-plus-square" style="font-size: 2rem; color: #1877F2;"></i>
                <h3 class="fw-bold mt-2">Create a New Post</h3>
                <p class="text-muted">Share photos and videos with the farming community</p>
            </div>
            <form method="POST" action="{{ url_for('posts.create') }}" enctype="multipart/form-data">
                <div class="mb-4">
                    <label for="media" class="form-label fw-semibold">Upload Media</label>
                    <div class="upload-area border-2 border-dashed rounded-4 p-5 text-center bg-light" id="uploadArea">
                        <i class="bi bi-cloud-upload" style="font-size: 3rem; color: #1877F2;"></i>
                        <p class="mt-2 mb-1 fw-semibold">Click to upload or drag and drop</p>
                        <p class="text-muted small mb-3">PNG, JPG, JPEG, GIF, MP4, WEBM, MOV (max 50MB)</p>
                        <input type="file" id="media" name="media" class="form-control d-none"
                               accept="image/png,image/jpg,image/jpeg,image/gif,video/mp4,video/webm,video/quicktime" multiple>
                        <button type="button" class="btn btn-outline-primary rounded-pill px-4" onclick="document.getElementById('media').click()">Choose Files</button>
                    </div>
                    <div id="mediaPreview" class="mt-3 d-none">
                        <div id="previewContainer" class="row g-2"></div>
                        <button type="button" class="btn btn-sm btn-outline-danger rounded-pill mt-2" onclick="clearMediaPreview()">
                            <i class="bi bi-x-circle me-1"></i>Remove All
                        </button>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="caption" class="form-label fw-semibold">Caption</label>
                    <textarea id="caption" name="caption" class="form-control bg-light border-0 rounded-4 p-3" rows="4" placeholder="Write something about your photos..." required></textarea>
                </div>
                {% if groups %}
                <div class="mb-4">
                    <label for="group_id" class="form-label fw-semibold">Post to a Group (optional)</label>
                    <select id="group_id" name="group_id" class="form-select bg-light border-0 rounded-4 p-3">
                        <option value="">— Public Feed —</option>
                        {% for group in groups %}
                        <option value="{{ group.id }}" {% if preselected_group and group.name == preselected_group %}selected{% endif %}>{{ group.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                {% endif %}
                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">
                    <i class="bi bi-send me-2"></i>Share Post
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
