{% extends "base.html" %}
{% block title %}Settings - farmersblog{% endblock %}

{% block content %}
<div class="container" style="max-width: 680px;">
    <div class="card shadow-sm rounded-4 border-0">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-gear" style="font-size: 2rem; color: #1877F2;"></i>
                <h3 class="fw-bold mt-2">Edit Profile</h3>
                <p class="text-muted">Update your profile information</p>
            </div>
            <form method="POST" action="{{ url_for('profile.settings') }}" enctype="multipart/form-data">
                <div class="mb-4 text-center">
                    <label class="form-label fw-semibold d-block">Profile Picture</label>
                    {% if current_user.avatar_filename %}
                    <img src="{{ avatar_url(current_user.avatar_filename) }}"
                         class="rounded-circle mb-2" style="width: 100px; height: 100px; object-fit: cover;" alt="Avatar">
                    {% else %}
                    <div class="rounded-circle bg-primary bg-opacity-10 d-flex align-items-center justify-content-center mx-auto mb-2"
                         style="width: 100px; height: 100px;">
                        <i class="bi bi-person-fill text-primary" style="font-size: 3rem;"></i>
                    </div>
                    {% endif %}
                    <div>
                        <input type="file" id="avatar" name="avatar" class="form-control d-none" accept="image/png,image/jpg,image/jpeg,image/gif">
                        <button type="button" class="btn btn-outline-primary btn-sm rounded-pill px-3" onclick="document.getElementById('avatar').click()">
                            <i class="bi bi-camera me-1"></i>Change Photo
                        </button>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Username</label>
                    <input type="text" id="username" name="username" class="form-control bg-light border-0 rounded-4 p-3"
                           value="{{ current_user.username }}" required>
                </div>
                <div class="mb-3">
                    <label for="bio" class="form-label fw-semibold">Bio</label>
                    <textarea id="bio" name="bio" class="form-control bg-light border-0 rounded-4 p-3" rows="4"
                              placeholder="Tell us about yourself..." maxlength="300">{{ current_user.bio or '' }}</textarea>
                    <small class="text-muted">Max 300 characters</small>
                </div>
                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">
                    <i class="bi bi-check-lg me-2"></i>Save Changes
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
