{% extends "base.html" %}
{% block title %}Create Group - farmersblog{% endblock %}

{% block content %}
<div class="container" style="max-width: 680px;">
    <div class="card shadow-sm rounded-4 border-0">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-people" style="font-size: 2rem; color: #1877F2;"></i>
                <h3 class="fw-bold mt-2">Create a Group</h3>
                <p class="text-muted">Bring farmers together around a common interest</p>
            </div>
            <form method="POST" action="{{ url_for('groups.create') }}">
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Group Name</label>
                    <input type="text" id="name" name="name" class="form-control bg-light border-0 rounded-4 p-3" placeholder="e.g., Organic Farming Tips" required>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label fw-semibold">Description (optional)</label>
                    <textarea id="description" name="description" class="form-control bg-light border-0 rounded-4 p-3" rows="4" placeholder="What is this group about?"></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">
                    <i class="bi bi-plus-circle me-2"></i>Create Group
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
